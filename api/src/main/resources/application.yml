spring:
  application:
    name: watchtower-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/watchtower}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned and populated by the existing n8n pipeline — this API
      # never creates or alters tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  # No default on purpose: the app should fail to start rather than silently
  # run unprotected if API_KEY isn't set.
  api-key: ${API_KEY}
